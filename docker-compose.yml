# Banco de dados de DESENVOLVIMENTO local.
# Em producao (EasyPanel / VPS Hostinger) o Postgres e provisionado pelo painel,
# este arquivo nao vai para o servidor.
services:
  postgres:
    image: postgres:16-alpine
    container_name: coworking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coworking
      POSTGRES_PASSWORD: coworking_dev
      POSTGRES_DB: coworking
      # O BANCO RODA EM UTC, sempre. Nao coloque TZ aqui.
      # Com um fuso local, o driver grava os horarios 3 horas adiantados:
      # ele manda a data sem fuso e o Postgres interpreta como hora local.
      # Quem converte para o horario de Sao Paulo e a aplicacao (src/lib/tempo.ts).
      TZ: UTC
      PGTZ: UTC
    ports:
      # 5434 no computador -> 5432 dentro do container.
      # A porta 5432 ja esta ocupada por outro projeto nesta maquina.
      #
      # O "127.0.0.1" na frente NAO e enfeite: sem ele o Docker publica a
      # porta para a internet inteira, e a senha deste banco esta escrita
      # aqui em cima. Esta maquina tambem roda a producao, entao um Postgres
      # aberto no mundo e risco de verdade. Com o endereco na frente, so
      # quem ja esta dentro da maquina conecta — quem trabalha de fora chega
      # pelo tunel do SSH, que entra como se fosse local.
      #
      # Ligar o ufw NAO substitui isto: o Docker escreve as proprias regras
      # de rede antes do firewall, e a porta publicada passaria assim mesmo.
      - "127.0.0.1:5434:5432"
    volumes:
      - coworking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworking -d coworking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coworking_postgres_data:
